<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경쟁사 모니터</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
// 루트: 마지막에 쓴 보기(요약/상세)로, 처음이면 요약. 예전 주소(#biz, #biz-x, #hff, #microbiome)는 새 주소로
(function(){
  var h = location.hash.replace(/^#/, ""), v = "summary";
  try { v = localStorage.getItem("cm2-view") || "summary"; } catch (e) {}
  var map = { "biz": ["summary", "insight/core"], "biz-x": ["detail", "insight/core"], "hff": [null, "market/hff"], "microbiome": [null, "market/microbiome"] };
  var m = map[h], to = m ? (m[0] || v) + "/#" + m[1] : v + "/" + (h ? "#" + h : "");
  location.replace(to);
})();
</script>
</head>
<body><p style="font-family:sans-serif;padding:24px"><a href="summary/">경쟁사 모니터 열기</a></p></body>
</html>
