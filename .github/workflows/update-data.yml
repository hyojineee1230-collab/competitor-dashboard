name: Update market data

on:
  schedule:
    # 한국 장 마감 후 (평일 16:40 KST = 07:40 UTC), 미국 장 마감 후 (평일 06:40 KST = 21:40 UTC 전일)
    - cron: "40 7 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:   # Actions 탭에서 수동 실행
  push:
    paths:
      - "config/companies.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false   # 실행 중인 수집(첫 KRX 백필 등)을 끊지 않고 다음 실행은 대기

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 실행 중에 다른 커밋이 올라왔어도 실패하지 않도록: 최신을 받아 그 위에 얹고 푸시 (충돌 시 방금 수집한 데이터 우선)
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
