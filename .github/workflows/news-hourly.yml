name: Hourly news and quotes

on:
  schedule:
    # 평일 08:07~20:07 KST 매시 (UTC 23:07 전날, 00:07~11:07)
    - cron: "7 23 * * 0-4"
    - cron: "7 0-11 * * 1-5"
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: news-hourly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update news, reactions and intraday quotes
        run: python scripts/live.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "live: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
