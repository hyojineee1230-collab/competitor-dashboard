name: Hourly news and quotes

on:
  schedule:
    # 평일 08:07~20:07 KST 매시 (UTC 23:07 전날, 00:07~11:07)
    - cron: "7 23 * * 0-4"
    - cron: "7 0-11 * * 1-5"
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: news-hourly
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    env:
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update news, reactions and intraday quotes
        run: python scripts/live.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "live: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi

      # Cloudflare R2에 데이터 올리기(설정 전에는 건너뜀). 사이트는 /data/*를 R2에서 읽으므로 다시 배포하지 않아도 바로 반영
      - name: Upload data to R2
        if: env.HAS_R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 sync data/ "s3://${{ secrets.R2_BUCKET }}/data/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --exclude "*" --include "*.json" --exclude "reports/*" --only-show-errors
          echo "R2 업로드 완료"
