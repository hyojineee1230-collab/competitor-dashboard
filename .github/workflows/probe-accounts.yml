name: Probe detail accounts (1회용 점검)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/probe_sga.py"
      - "scripts/dart_audit.py"
      - ".github/workflows/probe-accounts.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/probe_sga.py
      - name: 결과를 임시 브랜치에 저장 (main·data는 건드리지 않음)
        run: |
          mkdir /tmp/out && cp probe_out.json /tmp/out/ && cd /tmp/out
          git init -q -b probe-results
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out.json && git commit -q -m "probe results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
