name: Probe detail accounts (1회용 점검)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/probe_accounts.py"
      - ".github/workflows/probe-accounts.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/probe_accounts.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe_out.json
          retention-days: 3
